# Android debug APK, built on a Linux runner so nobody needs JDK 21 and the
# Android SDK locally. Same steps as apps/mobile/README.md; the APK is a run
# artifact, signed with the runner's debug key and pointed at staging.
#
# ponytail: debug-signed only. A Play upload (AAB) needs a release upload key
# with a named owner first — see the README.
name: Android APK (manual)

on:
  workflow_dispatch:
  push:
    branches: [build/android-apk]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Sync the shell against staging
        working-directory: apps/mobile
        env:
          MOBILE_SERVER_URL: ${{ vars.IOS_STAGING_URL }}
        run: npm ci && npm run sync
      - name: Build
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: youhan-one-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
