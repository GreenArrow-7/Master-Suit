# iOS development build → signed App Store Connect export → TestFlight upload.
#
# MANUAL ONLY: the single trigger is workflow_dispatch. Nothing runs on push, tag or
# pull request. GitHub only offers dispatch for a workflow whose file exists on the
# default branch; the run then uses the file and code of the ref you choose, and this
# job refuses any ref other than dev/mobile-app.
#   gh workflow run ios-testflight.yml --ref dev/mobile-app
#
# COST: GitHub-hosted macOS runners bill minutes on private repositories.
#
# The app is the DEVELOPMENT PROOF OF CONCEPT shell (bundle id com.youhan.one). It
# loads IOS_STAGING_URL. It never targets production and never submits for review.
#
# Configuration: repository Settings → Secrets and variables → Actions (repository-level;
# GitHub Free cannot use environments on private repositories). Values are never printed;
# the preflight reports only which names are missing.
#   Variables:
#     APPLE_TEAM_ID          10-character Apple Developer Team ID
#     IOS_STAGING_URL        https origin of the isolated staging server. Must load
#                            without an interstitial page (dev tunnels are refused).
#   Secrets (an App Store Connect **Team** API key with the **Admin** role — the
#   Developer-program roles matrix gives certificate, identifier and profile
#   management, including the cloud-managed distribution certificate, to Account
#   Holder and Admin only; an App Manager key can upload but cannot provision):
#     ASC_KEY_ID             key ID
#     ASC_ISSUER_ID          issuer ID
#     ASC_KEY_P8_BASE64      the downloaded AuthKey_<KeyID>.p8, base64-encoded
#
# Signing approach: archive without code signing, then let `xcodebuild -exportArchive`
# sign for App Store Connect with automatic signing (-allowProvisioningUpdates and the
# API key). Distribution signing then uses the team's cloud-managed distribution
# certificate and an App Store profile Xcode creates, so no development certificate or
# registered test device is needed on the runner. Not yet proven on a runner: the first
# run's logs are the evidence.

name: iOS TestFlight (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Signed export and TestFlight upload
    if: github.ref == 'refs/heads/dev/mobile-app'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — configuration present and acceptable
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_STAGING_URL: ${{ vars.IOS_STAGING_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID IOS_STAGING_URL ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository Actions variables/secrets: ${missing[*]}"
            exit 1
          fi
          case "$IOS_STAGING_URL" in
            https://*.devtunnels.ms|https://*.devtunnels.ms/) echo "::error::IOS_STAGING_URL is a dev tunnel; its anti-phishing page would appear inside the app."; exit 1;;
            https://*) ;;
            *) echo "::error::IOS_STAGING_URL must be https"; exit 1;;
          esac
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.youhan.one;' ios/App/App.xcodeproj/project.pbxproj \
            || { echo "::error::The Xcode project bundle id is not com.youhan.one"; exit 1; }

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26+ on this runner image"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -help 2>&1 | grep -q -- '-authenticationKeyIssuerID' \
            || { echo "::error::This xcodebuild does not accept App Store Connect API key authentication"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync iOS
        env:
          MOBILE_SERVER_URL: ${{ vars.IOS_STAGING_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs

      - name: Archive (unsigned)
        run: |
          set -uo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          grep -E '^(\*\*|error:)' "$RUNNER_TEMP/archive.log" | tail -40 || true
          if [ "$status" -ne 0 ] || [ ! -d "$RUNNER_TEMP/YouhanOne.xcarchive" ]; then
            echo "::error::Archive failed (exit $status); see the archive.log artifact."
            exit 1
          fi

      - name: App Store Connect API key (temporary file)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" \
            || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }

      - name: Sign for App Store Connect and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          grep -E '^(\*\*|error:)|[Uu]pload|[Ss]igning|[Pp]rofile|[Cc]ertificate' "$RUNNER_TEMP/export.log" | tail -40 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Signing/upload failed (exit $status); see the export.log artifact."
            exit 1
          fi
          echo "Uploaded build ${GITHUB_RUN_NUMBER} (com.youhan.one). App Store Connect processing follows."

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
