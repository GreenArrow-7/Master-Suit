# iOS development build → signed App Store Connect archive → TestFlight.
#
# MANUAL ONLY. Nothing here runs on an ordinary push or pull request.
#   - Push a tag named ios-testflight-<anything> that points at a commit on the
#     dev/mobile-app branch, e.g.  git tag ios-testflight-0.1.0-1 && git push origin ios-testflight-0.1.0-1
#   - or, once this file exists on the default branch, use "Run workflow".
#
# COST: GitHub-hosted macOS runners bill minutes on private repositories. Check the
# account's Actions usage and budget before running.
#
# The build is the DEVELOPMENT PROOF OF CONCEPT shell: it loads the staging origin in
# IOS_STAGING_URL. It never targets production and never submits for App Store review.
#
# Required configuration (Settings → Environments → ios-testflight). No value is ever
# printed; the preflight step only reports which names are missing.
#   Variables:
#     APPLE_TEAM_ID          10-character Apple Developer Team ID
#     IOS_BUNDLE_ID          the confirmed bundle identifier, registered for the team and
#                            used by the App Store Connect app record
#     IOS_STAGING_URL        https origin of the isolated staging server
#   Secrets:
#     ASC_KEY_ID             App Store Connect API key ID
#     ASC_ISSUER_ID          App Store Connect API issuer ID
#     ASC_KEY_P8_BASE64      the downloaded AuthKey_XXXX.p8, base64-encoded
#   The API key needs the App Manager role (or Admin) with access to certificates,
#   identifiers and profiles, so Xcode can create the distribution certificate and
#   App Store profile under automatic signing.

name: iOS TestFlight (manual)

on:
  push:
    tags:
      - 'ios-testflight-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Signed archive and TestFlight upload
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-testflight
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only commits on dev/mobile-app
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/dev/mobile-app:refs/remotes/origin/dev/mobile-app
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev/mobile-app; then
            echo "::error::$GITHUB_SHA is not on dev/mobile-app; refusing to build."
            exit 1
          fi

      - name: Preflight — required configuration present
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_STAGING_URL: ${{ vars.IOS_STAGING_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID IOS_STAGING_URL ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing configuration in the ios-testflight environment: ${missing[*]}"
            exit 1
          fi
          case "$IOS_STAGING_URL" in https://*) ;; *) echo "::error::IOS_STAGING_URL must be https"; exit 1;; esac
          if [ "$IOS_BUNDLE_ID" = "com.mastersuite.app" ]; then
            echo "::error::IOS_BUNDLE_ID is still the placeholder; confirm the final identifier first."
            exit 1
          fi

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26+ on this runner image"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync iOS
        env:
          MOBILE_SERVER_URL: ${{ vars.IOS_STAGING_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs

      - name: App Store Connect API key (temporary file)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive (automatic signing)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          grep -E '^(\*\*|error:)|[Ss]igning|[Pp]rovisioning' "$RUNNER_TEMP/archive.log" | tail -40 || true
          if [ "$status" -ne 0 ] || [ ! -d "$RUNNER_TEMP/YouhanOne.xcarchive" ]; then
            echo "::error::Archive failed (exit $status); see the archive.log artifact."
            exit 1
          fi

      - name: Export and upload to App Store Connect (TestFlight)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          grep -E '^(\*\*|error:)|[Uu]pload' "$RUNNER_TEMP/export.log" | tail -40 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Export/upload failed (exit $status); see the export.log artifact."
            exit 1
          fi
          echo "Uploaded build ${GITHUB_RUN_NUMBER} for bundle ${{ vars.IOS_BUNDLE_ID }}. App Store Connect processing follows; TestFlight shows it when processing finishes."

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
