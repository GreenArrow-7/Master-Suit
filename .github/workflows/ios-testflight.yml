# iOS development build → signed App Store archive → TestFlight upload.
#
# MANUAL ONLY: the single trigger is workflow_dispatch, and the job runs only for
# refs/heads/dev/mobile-app. GitHub offers dispatch only for a workflow whose file is on
# the default branch; the run uses the file and code of the chosen ref.
#   gh workflow run ios-testflight.yml --ref dev/mobile-app
#
# COST: GitHub-hosted macOS runner minutes are billed on private repositories.
#
# The app is the DEVELOPMENT PROOF OF CONCEPT shell (bundle id com.youhan.one) loading
# IOS_STAGING_URL. It never targets production and never submits for App Store review.
#
# LEAST PRIVILEGE. Signing is manual, so CI holds no provisioning rights:
#   - An Apple Distribution certificate and an App Store profile named
#     "YOUHAN ONE App Store" are created once by the Account Holder in Certificates,
#     Identifiers & Profiles (the only roles that can create them are Account Holder and
#     Admin). The Xcode project's App target Release configuration names them.
#   - Upload uses an App Store Connect Team API key with the Developer role — the least
#     role Apple's matrix allows to upload builds; it cannot create certificates or profiles.
#
# Configuration: repository Settings → Secrets and variables → Actions (repository-level;
# GitHub Free cannot use environments on private repositories). Values are never printed.
#   Variables: APPLE_TEAM_ID (3SHW6AX727), IOS_STAGING_URL (https, no interstitial page)
#   Secrets:   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_APPSTORE_PROFILE_BASE64,
#              ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64

name: iOS TestFlight (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Backend the app is compiled against. `staging` uses IOS_STAGING_URL (the test
          rounds); `production` uses IOS_PRODUCTION_URL and produces the App Store candidate.
          Neither submits for review.
        type: choice
        required: true
        default: staging
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.youhan.one
  PROFILE_NAME: YOUHAN ONE App Store

jobs:
  testflight:
    name: Signed archive and TestFlight upload
    if: github.ref == 'refs/heads/dev/mobile-app'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — configuration present and acceptable
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_STAGING_URL: ${{ inputs.target == 'production' && vars.IOS_PRODUCTION_URL || vars.IOS_STAGING_URL }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID IOS_STAGING_URL IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                      IOS_APPSTORE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository Actions variables/secrets: ${missing[*]}"
            exit 1
          fi
          case "$IOS_STAGING_URL" in
            https://*.devtunnels.ms|https://*.devtunnels.ms/) echo "::error::IOS_STAGING_URL is a dev tunnel; its anti-phishing page would appear inside the app."; exit 1;;
            https://*) ;;
            *) echo "::error::IOS_STAGING_URL must be https"; exit 1;;
          esac
          pbx=ios/App/App.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$pbx" || { echo "::error::Project bundle id is not $BUNDLE_ID"; exit 1; }
          grep -q "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" "$pbx" || { echo "::error::Project team does not match APPLE_TEAM_ID"; exit 1; }
          grep -q "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";" "$pbx" || { echo "::error::Project does not name the $PROFILE_NAME profile"; exit 1; }

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26+ on this runner image"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync iOS
        env:
          # The same variable the preflight validated: https, no dev tunnel, no path.
          MOBILE_SERVER_URL: ${{ inputs.target == 'production' && vars.IOS_PRODUCTION_URL || vars.IOS_STAGING_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs

      - name: Install the distribution certificate and App Store profile (temporary keychain)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution: .*($APPLE_TEAM_ID)" \
            || { echo "::error::The certificate is not an Apple Distribution identity for team APPLE_TEAM_ID"; exit 1; }

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true; }
          [ "$(pb Name)" = "$PROFILE_NAME" ] || { echo "::error::Profile name is not '$PROFILE_NAME'"; exit 1; }
          [ "$(pb TeamIdentifier:0)" = "$APPLE_TEAM_ID" ] || { echo "::error::Profile team does not match APPLE_TEAM_ID"; exit 1; }
          [ "$(pb Entitlements:application-identifier)" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] || { echo "::error::Profile is not for $BUNDLE_ID"; exit 1; }
          [ -z "$(pb ProvisionedDevices)" ] || { echo "::error::Profile lists devices; an App Store profile is required"; exit 1; }
          [ "$(pb Entitlements:get-task-allow)" != "true" ] || { echo "::error::Profile is a development profile"; exit 1; }
          expires=$(pb ExpirationDate)
          echo "Profile OK: $PROFILE_NAME, team $APPLE_TEAM_ID, $BUNDLE_ID, expires $expires"
          uuid=$(pb UUID)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/distribution.p12"

      - name: Archive (manual signing from the project's Release configuration)
        run: |
          set -uo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          grep -E '^(\*\*|error:)|[Ss]igning|[Pp]rovisioning' "$RUNNER_TEMP/archive.log" | tail -40 || true
          if [ "$status" -ne 0 ] || [ ! -d "$RUNNER_TEMP/YouhanOne.xcarchive" ]; then
            echo "::error::Archive failed (exit $status); see the archive.log artifact."
            exit 1
          fi
          app="$RUNNER_TEMP/YouhanOne.xcarchive/Products/Applications/App.app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)=' || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Info.plist"

      - name: App Store Connect API key (temporary file)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" \
            || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }

      - name: Export for App Store Connect and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YouhanOne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          grep -E '^(\*\*|error:)|[Uu]pload|[Ss]igning|[Pp]rofile' "$RUNNER_TEMP/export.log" | tail -40 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Export/upload failed (exit $status); see the export.log artifact."
            exit 1
          fi
          echo "Uploaded $BUNDLE_ID build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}. Apple processing follows."

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.plist"
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
