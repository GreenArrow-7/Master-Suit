# Builds the immutable production images for one exact commit and pushes them
# to GHCR tagged by that commit's full SHA. Never `latest`. Dispatched by hand
# (or, later, by the release pipeline); production only ever pulls.
name: Build images

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            target: production
          - image: worker
            target: worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Refuse anything but the exact commit asked for
        run: |
          HEAD="$(git rev-parse HEAD)"
          [ "$HEAD" = "${{ inputs.sha }}" ] || { echo "::error::checked out $HEAD, asked for ${{ inputs.sha }}"; exit 1; }
          echo "building $HEAD"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ inputs.sha }}
          build-args: |
            GIT_SHA=${{ inputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record what was published
        run: |
          echo "| image | tag | digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ steps.meta.outputs.repo }}/${{ matrix.image }} | ${{ inputs.sha }} | ${{ steps.build.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"
