# The release gates, in the order a failure is cheapest to diagnose: static
# checks first, then tests, then a build, then the dependency audit.
#
# There is one job, not eight. Every gate needs the same installed node_modules
# and the same generated Prisma client, and splitting them into parallel jobs
# would pay that cost repeatedly to save less time than it spends.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # NODE_ENV is deliberately NOT set here.
      #
      # `next build` must run as production. Forcing development leaks into the
      # build and breaks prerendering with "Cannot read properties of null
      # (reading 'useContext')" — React resolves to the wrong runtime for the
      # server render. Each step gets what it needs instead: vitest sets `test`,
      # the seed reads the default `development` from lib/env.ts, and the build
      # gets production from Next itself.
      CI: 'true'
      # tsc over this codebase (a 6 800-line Prisma schema and its generated
      # client types) needs ~3 GB of heap; Node's default on the runner is ~2 GB
      # and the typecheck gate died OOM-killed mid-mark-compact. Job-wide, so
      # the vitest and next-build steps — the next-largest heaps — get it too.
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # Creates apps/web/.env from apps/web/.env.example, then overwrites the
      # three placeholder secrets with real 32-byte values.
      #
      # `.env` only, deliberately. `.env.test` points DATABASE_URL at a separate
      # `master_saas_test` database that a developer creates locally with
      # `npm run setup`; this runner has one. Vitest prefers `.env.test` when it
      # exists, so generating it here sent every suite at a database that does
      # not exist on the server.
      - name: Generate .env
        run: node scripts/generate-secrets.mjs .env

      # tests/tenant/rls.spec.ts refuses to run unless RLS_DATABASE_URL is set and
      # names the *same* connection as DATABASE_URL — testing a role the
      # application never connects as would prove nothing, so it throws rather
      # than skipping. Derived from .env rather than repeated, so the two cannot
      # drift apart.
      - name: Export RLS connection
        run: echo "RLS_DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx prisma migrate deploy

      # ── Gate 0a — schema/migration drift ──────────────────────────────────
      #
      # `schema.prisma` and `prisma/migrations` are two descriptions of one
      # database and nothing kept them in step. HrLeaveBalance, HrChecklistTask,
      # HrOffboardingCase, HrSettlementSnapshot and HrEmployeeLocationAssignment
      # were all declared in the schema with no migration creating them, so every
      # code path touching them typechecked cleanly and failed at runtime.
      #
      # The database here has just had every migration replayed into it, so
      # comparing it against the schema compares exactly those two things. Exit
      # code 2 means "they differ".
      - name: Schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # ── Gate 0b — tenant isolation is still intact ────────────────────────
      #
      # RLS is the layer that holds when the other two are bypassed, and it is
      # the one that can be silently removed: a migration re-running the catalog
      # sweep with a stale copy of the policy body drops FORCE across every
      # tenant table, and `\d` still shows a policy on each of them.
      #
      # This asserts against the catalog rather than against a list somebody
      # maintains. It found HrOvertimeRequest missing both FORCE and the
      # app.platform_admin branch on its first run.
      - name: Tenant isolation
        run: node scripts/check-rls.mjs

      # The server integration specs sign in as a member of the `manath-homes`
      # workspace, which only exists once the demo data is seeded. The seed
      # refuses to run against NODE_ENV=production, so it cannot touch a real
      # deployment from here.
      - name: Seed demo data
        # ALLOW_DEMO_SEED is the seed's own guard: it creates dozens of active
        # logins and refuses to run until the operator confirms the target is
        # disposable. A CI database is created and destroyed with the job.
        env:
          ALLOW_DEMO_SEED: 'yes'
          # The seed refuses to run against production, and says so.
          NODE_ENV: development
        run: npm run db:seed

      # ── Gate 1 ────────────────────────────────────────────────────────────
      - name: Typecheck
        run: npx tsc --noEmit

      # ── Gate 2 ────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Gate 3 — format check ─────────────────────────────────────────────
      #
      # Absent since 2026-08-15, when `npm run format:check` failed on 678 files
      # and enforcing it would have forced a 678-file reformat into whichever PR
      # ran first, while several branches were in flight.
      #
      # Most of that 678 was not source. `.prettierignore` did not list
      # `.next-prod` — the local production build's output directory, which
      # vendors dependencies with their own sources — so once anybody had run a
      # production build the check was measuring third-party packages. With that
      # one line added the real number was 99 files, reformatted in the same
      # commit that re-enables this. (2026-08-20)
      - name: Format check
        run: npm run format:check

      # ── Gate 3b — the README's schema counts ──────────────────────────────
      #
      # It claimed "79 models, 25 enums, 119 indexes" against a schema holding
      # 192, 103 and 332. The first file a newcomer opens was wrong, and a reader
      # who catches one wrong number stops trusting the rest of the page.
      #
      # Counting by hand and pasting the result is how it got that way, so the
      # numbers are generated between markers and this checks the paste.
      - name: README schema counts
        run: node scripts/schema-stats.mjs --check

      # ── Gate 3c — the monitoring stack and the thing it monitors ───────────
      #
      # Every failure this catches is a silent one. A renamed scrape job turns
      # ApplicationDown into a rule that can never fire; a queue missing from
      # QueueHasNoConsumer is a queue whose worker can exit unnoticed, which is
      # exactly how the worker process came to be dead in production for months;
      # an overlay that stops clearing the `observability` profile is a
      # deployment that quietly runs with no scraper at all.
      #
      # None of those break a test or a build. They only show up as monitoring
      # that was never going to say anything.
      - name: Observability drift
        run: npm run check:observability

      # ── Gate 4 ────────────────────────────────────────────────────────────
      #
      # A skipped test is a failure here. `describe.skip` and `it.skip` are the
      # cheapest way to make a suite green while deleting its coverage, and a
      # summary line reading "0 failed" hides them completely — so the run is
      # rejected if the reporter mentions any.
      - name: Test
        run: |
          set -o pipefail
          npx vitest run --reporter=default 2>&1 | tee vitest.log
          if grep -Eq '[0-9]+ (skipped|todo)' vitest.log; then
            echo "::error::Skipped or todo tests are not allowed. See the summary above."
            exit 1
          fi

      # ── Gate 5 ────────────────────────────────────────────────────────────
      #
      # Integration specs that drive a running application. They own their own
      # server: tests/server/globalSetup.ts starts one on a free port, waits for
      # it to answer, and stops it again whether the run passes or fails. Gate 4
      # used to collect these, and failed on every clean run because nothing had
      # started a server yet.
      - name: Integration (server)
        run: npm run test:server

      # ── Gate 6 ────────────────────────────────────────────────────────────
      #
      # The browser is cached and installed in its own step, because this is
      # where CI kept failing without a test ever running.
      #
      # `playwright install --with-deps` shells out to apt-get. When the Azure
      # Ubuntu mirror went unreachable it retried, fell back to archive.ubuntu.com,
      # and then sat silent for 24 minutes until the 30-minute job timeout killed
      # the run — taking Build and Audit with it. Nothing was wrong with the code
      # and no test had started.
      #
      # So: cache the browser on its version, install without touching apt, and
      # reach for apt only if Chromium genuinely cannot launch. The bounded
      # timeout means a stall costs six minutes and names itself, instead of
      # eating the job's whole budget.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          npx playwright install chromium
          # The runner image already ships Chromium's shared libraries. Only if
          # that turns out to be false is apt worth the risk.
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium

      - name: E2E
        timeout-minutes: 15
        run: npx playwright test

      # ── Gate 7 ────────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── Gate 8 ────────────────────────────────────────────────────────────
      #
      # Production dependencies only. A dev-only advisory does not ship.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
