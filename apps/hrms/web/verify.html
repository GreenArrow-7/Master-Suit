<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify — Manath Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body class="auth">
<div class="auth-card">
  <div class="mark">M</div>
  <div class="eyebrow">Manath Homes</div>
  <h1>Verification code</h1>
  <p class="lede" id="hint">Open your authenticator app and enter the 6-digit code
    for <span id="who"></span>.</p>

  <div class="field">
    <label for="code">Code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="14"
           placeholder="000000"
           style="font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center">
  </div>

  <button class="btn block" id="go">Verify</button>
  <div class="msg" id="msg" style="margin-top:14px"></div>

  <div style="margin-top:16px;text-align:center">
    <a class="link" id="useRecovery" href="#">Lost your phone? Use a recovery code</a>
  </div>
</div>

<script src="shell.js"></script>
<script>
const mfaToken = sessionStorage.getItem("mfa_token");
$("who").textContent = sessionStorage.getItem("mfa_email") || "your account";
if (!mfaToken) location.href = "login.html";

let recoveryMode = false;
$("useRecovery").onclick = e => {
  e.preventDefault();
  recoveryMode = !recoveryMode;
  const box = $("code");
  box.value = "";
  box.placeholder = recoveryMode ? "XXXX-XXXX" : "000000";
  box.style.letterSpacing = recoveryMode ? ".1em" : ".3em";
  $("hint").textContent = recoveryMode
    ? "Enter one of the recovery codes you saved when you set up your authenticator. Each works once."
    : "Open your authenticator app and enter the 6-digit code.";
  $("useRecovery").textContent = recoveryMode
    ? "Use your authenticator app instead"
    : "Lost your phone? Use a recovery code";
  box.focus();
};

async function verify() {
  const code = $("code").value.trim();
  if (!code) return say("Enter the code.", "err");
  $("go").disabled = true;
  say("Checking\u2026");
  try {
    const r = await fetch("/api/auth/2fa/verify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mfa_token: mfaToken, code })
    });
    const d = await handleResponse(r);
    localStorage.setItem("token", d.access_token);
    localStorage.setItem("refresh", d.refresh_token);
    localStorage.setItem("email", sessionStorage.getItem("mfa_email") || "");
    sessionStorage.removeItem("mfa_token");
    location.href = d.must_change_password ? "password.html" : "checkin.html";
  } catch (e) {
    say(e.message, "err");
    $("go").disabled = false;
    $("code").select();
  }
}
$("go").onclick = verify;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") verify(); });
$("code").focus();
</script>
</body>
</html>
