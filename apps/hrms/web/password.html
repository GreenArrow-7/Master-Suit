<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set your password — Manath Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body class="auth">
<div class="auth-card">
  <div class="mark">M</div>
  <div class="eyebrow">Manath Homes</div>
  <h1>Set your password</h1>
  <p class="lede">Your account was created with a temporary password that someone
    else knows. Choose your own — nothing else opens until you do.</p>

  <div class="field">
    <label for="cur">Temporary password</label>
    <input id="cur" type="password" autocomplete="current-password">
  </div>
  <div class="field">
    <label for="nw">New password</label>
    <input id="nw" type="password" autocomplete="new-password">
    <div class="hint" id="rule">At least 12 characters</div>
  </div>
  <div class="field">
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password">
  </div>

  <button class="btn block" id="go">Save and continue</button>
  <div class="msg" id="msg" style="margin-top:14px"></div>
</div>

<script src="shell.js"></script>
<script>
$("nw").addEventListener("input", e => {
  const ok = e.target.value.length >= 12;
  $("rule").textContent = ok ? "Long enough" : "At least 12 characters";
  $("rule").style.color = ok ? "var(--ok)" : "";
});

$("go").onclick = async () => {
  const cur = $("cur").value, nw = $("nw").value;
  if (nw !== $("confirm").value) return say("The new passwords don't match.", "err");
  if (nw.length < 12) return say("Use at least 12 characters.", "err");
  if (nw === cur) return say("Choose a password different from the temporary one.", "err");
  $("go").disabled = true;
  try {
    await api("/api/auth/password", {
      method: "POST",
      body: JSON.stringify({ current_password: cur, new_password: nw })
    });
    say("Saved. Signing you in\u2026", "ok");
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ username: localStorage.getItem("email"), password: nw })
    });
    const d = await handleResponse(r);
    if (d.mfa_required) {
      sessionStorage.setItem("mfa_token", d.mfa_token);
      sessionStorage.setItem("mfa_email", localStorage.getItem("email"));
      location.href = "verify.html";
      return;
    }
    if (d.must_enrol_2fa) {
      localStorage.setItem("token", d.enrollment_token);
      localStorage.removeItem("refresh");
      sessionStorage.setItem("enrollment_mode", "1");
      location.href = "security.html";
      return;
    }
    localStorage.setItem("token", d.access_token);
    localStorage.setItem("refresh", d.refresh_token);
    location.href = "checkin.html";
  } catch (e) {
    say(e.message, "err");
    $("go").disabled = false;
  }
};
$("cur").focus();
</script>
</body>
</html>
