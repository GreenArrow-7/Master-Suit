<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Not configured</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #1a0a11;
        color: #f3f0f1;
      }
      code {
        color: #e8b04b;
      }
    </style>
  </head>
  <body>
    <!--
      Capacitor requires a webDir, and this is all that is in it. The real
      application is loaded over the network from `server.url`; this page is
      what a build made without MOBILE_SERVER_URL set will show, which is the
      only way that mistake is visible before the store review finds it.
    -->
    <h1>No server configured</h1>
    <p>Set <code>MOBILE_SERVER_URL</code> and run <code>npm run sync</code> before building.</p>
  </body>
</html>
