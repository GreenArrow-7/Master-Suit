apply plugin: 'com.android.application'

android {
    // The Java/R package, not the store identity: it stays com.youhan.one so no
    // source moves. What Play and the phone know the app by is applicationId.
    namespace = "com.youhan.one"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Play treats a package name as a different app, and it can never change
        // after an upload: com.youhan.one1 is a new Play listing, not an update
        // to com.youhan.one.
        applicationId "com.youhan.one1"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // A versionCode cannot be reused, and one code means exactly one
        // artefact: 8 was the last com.youhan.one bundle, 9 the first
        // com.youhan.one1 one, 10 its closed-testing build (10 Oct). The shell
        // is unchanged since 9, so the versionName stays.
        versionCode 10
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing from a properties file that is never committed (android/.gitignore).
    // Absent → unsigned release build, which Gradle refuses to package as a bundle, so a
    // machine without the upload key cannot produce something that looks releasable.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            /**
             * R8 on, which is what Play was reporting the absence of.
             *
             * Bundle 6 (1.1.0) came back with "DEX code optimization: Low",
             * "Obfuscation percentage: 2%" and an empty "R8 configuration". All
             * three are one cause: `minifyEnabled false` means R8 never runs, so
             * there is nothing to report. R8 is already the shrinker in AGP 8.13 —
             * it was simply not being invoked.
             *
             * Safe for a Capacitor app because the framework keeps its own
             * reflection surface: @capacitor/android declares
             * `consumerProguardFiles 'proguard-rules.pro'`, which is applied to
             * this app automatically and keeps @CapacitorPlugin classes, Plugin
             * subclasses, their @PluginMethod/@PermissionCallback/@ActivityCallback
             * members and the Cordova compatibility classes. This shell registers
             * no third-party plugins, so that is the whole surface.
             *
             * `proguard-android-optimize.txt`, not `proguard-android.txt`: the
             * plain variant switches optimisation passes off, which is the half of
             * the Play report that obfuscation alone does not answer.
             */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
