# Production overlay: built image, no dev server, no source mount.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The image is built with `next build` and served by the standalone server —
# `next start` refuses to run against `output: 'standalone'`, which is what
# next.config sets. There is no bind mount: the container serves the artefact it
# was built with, so what runs is what was tested.
#
# Measured against the same database, the production build answers the HR pages
# 4-8x faster than `next dev` does (docs/PERFORMANCE.md). That gap is compiler
# and instrumentation overhead in the dev server, not query time, which is why
# no production number should ever be quoted from a dev server.
services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: production
    command: ['node', 'server.js']
    environment:
      NODE_ENV: production
      PROCESS_ROLE: web
      # This said `leadflow:leadflow` — the owning role, which is a superuser on
      # this cluster. lib/startup-check.ts refuses to serve as a superuser,
      # because a superuser bypasses every row-level-security policy in the
      # schema, so `base + prod` could not start at all: the overlay was only
      # ever usable with docker-compose.azure.yml layered on top to restate this
      # one value. An overlay that cannot run without a third file is a trap.
      DATABASE_URL: postgresql://master_saas_app:master_saas_app@postgres:5432/leadflow?schema=public&connection_limit=20&sslmode=disable
      REDIS_URL: redis://redis:6379
      # A real SMTP transport pointed at the local mailbox. Not a mock: the
      # message is composed, sent and delivered for real — it just lands in
      # Mailpit instead of somebody's inbox.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # Migrations and the shadow database run from inside the container too,
      # and .env necessarily points both at localhost for the host workflow.
      MIGRATION_DATABASE_URL: postgresql://leadflow:leadflow@postgres:5432/leadflow?schema=public&sslmode=disable
      SHADOW_DATABASE_URL: postgresql://leadflow:leadflow@postgres:5432/leadflow_shadow?schema=public&sslmode=disable
    restart: unless-stopped
    depends_on:
      mailpit: { condition: service_healthy }
    ports: ['3000:3000']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    # `target: worker` and no `command:`. The previous pair — the `production`
    # image, which contains only next build's standalone output, told to run
    # `node dist/workers/index.js`, which no build produces — meant this
    # container exited on start in every deployment that used this overlay.
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql://master_saas_app:master_saas_app@postgres:5432/leadflow?schema=public&connection_limit=10&sslmode=disable
      REDIS_URL: redis://redis:6379
    # Meaningful now that the entrypoint exits non-zero when a queue cannot
    # attach: Compose restarts it, and a genuinely broken configuration shows up
    # as a crash loop instead of a container that is "up" and consuming nothing.
    restart: unless-stopped
    deploy:
      replicas: 2
