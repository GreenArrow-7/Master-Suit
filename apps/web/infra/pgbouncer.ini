; PgBouncer for Master Suite.
;
; ── Why transaction pooling is safe here ────────────────────────────────────
;
; The assessment recorded this as blocked: "PgBouncer in transaction mode is
; incompatible with the current RLS approach ... This needs design work, not
; configuration." That is inverted, and the whole test suite passing through
; PgBouncer 1.22 in this mode is the evidence.
;
; Tenant isolation is handed to Postgres with `set_config('app.tenant_id', …,
; true)` — the third argument is `true`, meaning *transaction-local*. A
; transaction pooler pins one server connection for the duration of a
; transaction, so `BEGIN; set_config(…, true); SELECT …; COMMIT` lands whole on
; one connection and the setting is discarded at COMMIT, before that connection
; can be handed to anybody else.
;
; What would be incompatible is session-level `set_config(…, false)`: the setting
; survives the transaction, the connection goes back to the pool carrying it, and
; the next borrower reads another tenant's rows without having asked to. Nothing
; in `src/` does that, and `tests/tenant/pooling.spec.ts` demonstrates both sides
; so the safe one is known to be capable of failing.
;
; ── Do you need this yet? ───────────────────────────────────────────────────
;
; Probably not. `max_connections=200` against pools of 20 (web) and 10 (worker)
; is comfortable to roughly 1,000 organizations. This overlay exists so that when
; you do, it is `docker compose -f … -f docker-compose.pgbouncer.yml up -d` and a
; connection string, rather than a design exercise during an incident.

[databases]
; `dbname` is fixed rather than passed through: this pooler fronts one database,
; and a wildcard entry would let a client name any database on the host.
leadflow = host=postgres port=5432 dbname=leadflow

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction pooling. See the note above — this is the mode the isolation model
; is designed for, not one it tolerates.
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Sized against Postgres, not against the application. The point of a pooler is
; that many client connections share few server ones: 25 per database is well
; inside max_connections=200, with room for migrations, psql and the backup job,
; which all connect directly.
max_client_conn = 500
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3

; Prisma's driver adapter (node-postgres) sends unnamed statements, and PgBouncer
; 1.21+ handles named prepared statements in transaction mode anyway. Set
; explicitly so a future driver change is a deliberate decision rather than a
; surprise.
max_prepared_statements = 100

; `options` is what a libpq client passes `-c` settings in at connect time; the
; application sets nothing that way, and refusing to start over an unrecognised
; startup parameter is a bad trade for a pooler.
ignore_startup_parameters = extra_float_digits,options

; Recycled well inside any load balancer or firewall idle timeout, so a client
; never inherits a server connection that has been silently dropped.
server_lifetime = 3600
server_idle_timeout = 600

; A transaction that has held a server connection this long is a bug, and letting
; it hold one starves everybody else. Longer than the retention sweep's own
; 120-second transaction budget, which is the longest legitimate one here.
idle_transaction_timeout = 300

log_connections = 0
log_disconnections = 0
stats_period = 60
