<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      /* Self-contained on purpose: this page is served with no network, so it
         cannot pull a stylesheet, a font or the icon from the origin. */
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem max(1.5rem, env(safe-area-inset-left));
        text-align: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f3f0f1;
        color: #1a0a11;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a0a11;
          color: #f3f0f1;
        }
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.72;
        font-size: 0.9375rem;
        max-width: 32ch;
      }
      button {
        justify-self: center;
        margin-top: 0.5rem;
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 8px;
        background: #2e0b16;
        color: #e8b04b;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>No connection</h1>
    <p>This screen needs the network. Nothing you had open has been lost — reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
